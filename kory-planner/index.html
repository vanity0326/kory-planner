<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kory's Planner</title>
  <meta name="theme-color" content="#f4f3ef" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/subjects.css" />
  <link rel="stylesheet" href="/src/styles/seasonal.css" />

  <style>
    /* Component-level styles for the shell and doing-screens. */
    #app { padding-top: 4px; }
    .today-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .today-header h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .streak-badge { display: flex; align-items: center; gap: 4px; background: var(--bg-warning); padding: 4px 10px; border-radius: 999px; color: var(--text-warning); font-size: 13px; font-weight: 600; }
    .today-date { font-size: 13px; color: var(--text-muted); margin: 0 0 1.25rem; }
    .assignment-list { display: flex; flex-direction: column; gap: 8px; }
    .assignment-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface-1); }
    .assignment-info { flex: 1; min-width: 0; }
    .assignment-title { margin: 0; font-size: 15px; font-weight: 500; }
    .mark-done { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-strong); background: transparent; padding: 0; flex-shrink: 0; }
    .done-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--fill-success); color: var(--on-success); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .overdue-tag { margin-left: 6px; font-size: 11px; color: var(--text-muted); }
    .overdue-tag-strong { color: var(--text-danger); font-weight: 600; }
    .section-divider { height: 1px; background: var(--border); margin: 6px 2px; }
    .empty-state { color: var(--text-muted); font-size: 14px; padding: 1rem 0; }
    .add-assignment-btn { width: 100%; margin-top: 1.25rem; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-primary); font-size: 14px; }

    form label { display: block; font-size: 13px; color: var(--text-secondary); margin: 1rem 0 4px; }
    form select, form input { width: 100%; height: 40px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); padding: 0 10px; font-size: 15px; background: var(--surface-1); color: var(--text-primary); }
    .form-actions { display: flex; gap: 8px; margin-top: 1.5rem; }
    .primary-btn, .secondary-btn { flex: 1; height: 44px; border-radius: var(--radius); font-size: 15px; }
    .primary-btn { background: var(--text-primary); color: var(--surface-1); border: none; }
    .secondary-btn { background: transparent; border: 0.5px solid var(--border-strong); color: var(--text-primary); }
    .field-error { color: var(--text-danger); font-size: 13px; margin-top: 4px; }
    .field-hint { color: var(--text-muted); font-size: 13px; margin-top: 8px; }

    .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 1rem; }
    .metric-card { background: var(--surface-1); border-radius: var(--radius); padding: 1rem; }
    .metric-label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
    .metric-value { font-size: 22px; font-weight: 600; margin: 0; }

    .settings-link { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 18px; color: var(--text-muted); padding: 8px; }

    /* Village ("feeling" screen) — richer visuals allowed here only */
    .village-screen { background: var(--surface-2); border-radius: 14px; padding: 1.25rem 1rem; border: 0.5px solid var(--border); }
    .avatar-card { display: flex; gap: 16px; align-items: center; background: var(--surface-1); border-radius: var(--radius); padding: 1rem; margin: 1rem 0 1.5rem; }
    .avatar-visual { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-warning); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--text-warning); flex-shrink: 0; }
    .avatar-info { flex: 1; }
    .avatar-stage { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .xp-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .xp-fill { height: 100%; background: var(--fill-success); }
    .xp-label { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
    .village-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .village-resident { background: var(--surface-1); border-radius: var(--radius); padding: 12px; text-align: center; font-size: 20px; color: var(--text-warning); }
    .resident-year { font-size: 12px; color: var(--text-primary); margin: 6px 0 2px; }
    .resident-stage { font-size: 11px; color: var(--text-muted); margin: 0; }

    /* Settings */
    .threshold-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
    .threshold-row button { background: none; border: none; color: var(--text-muted); font-size: 16px; }
    .threshold-add { display: flex; gap: 8px; margin-top: 10px; }
    .threshold-add input { height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); padding: 0 8px; background: var(--surface-1); color: var(--text-primary); }
    .ics-url-box input { height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); padding: 0 8px; background: var(--surface-1); color: var(--text-secondary); }
    h2 { font-size: 16px; margin: 1.5rem 0 0.5rem; }

    /* Race/entry mechanics */
    .segmented { display: flex; gap: 6px; margin-top: 4px; }
    .segmented-option { flex: 1; padding: 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); font-size: 14px; }
    .segmented-option.active { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
    .race-tally { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; flex-wrap: wrap; }
    .race-tally i { color: var(--text-warning); font-size: 15px; }
    .entry-streak-note { color: var(--text-muted); }
    .type-tag { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 11px; color: var(--text-secondary); }
    .type-tag i { font-size: 12px; }
    .nudge-chip { display: block; width: 100%; text-align: left; margin-bottom: 12px; padding: 10px 12px; border-radius: var(--radius); border: 0.5px dashed var(--border-strong); background: var(--surface-1); color: var(--text-secondary); font-size: 13px; }
    .milestone-toast { display: flex; align-items: center; gap: 8px; background: var(--bg-warning); color: var(--text-warning); padding: 10px 12px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; }
    .step-split-box { background: var(--surface-1); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
    .checkbox-row input { width: auto; height: auto; }
    .scaffolding-suggestion { background: var(--bg-warning); border-radius: var(--radius); padding: 12px; margin-top: 10px; }
    .study-nudges { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }

    /* Milestone toast + badges */
    .milestone-badge-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .milestone-badge-icon i { color: var(--surface-1); font-size: 15px; }
    .badge-shelf { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .badge-chip i { font-size: 14px; }
    .avatar-accessories { display: flex; gap: 4px; margin-top: 8px; }
    .badge-chip-mini { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .badge-chip-mini i { font-size: 11px; }
  </style>
</head>
<body>
  <div id="app" class="app-shell-chrome">
    <button class="settings-link" id="settings-gear" aria-label="Settings">
      <i class="ti ti-settings" aria-hidden="true"></i>
    </button>

    <main id="main-content"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="today" aria-label="Today"><i class="ti ti-list-check" aria-hidden="true"></i></button>
      <button data-route="home-practice" aria-label="Home practice"><i class="ti ti-notebook" aria-hidden="true"></i></button>
      <button data-route="village" aria-label="Village"><i class="ti ti-paw" aria-hidden="true"></i></button>
      <button data-route="reports" aria-label="Reports"><i class="ti ti-chart-bar" aria-hidden="true"></i></button>
    </nav>
  </div>

  <script src="/src/storage.js"></script>
  <script src="/src/avatar.js"></script>
  <script src="/src/views/today.js"></script>
  <script src="/src/views/add-assignment.js"></script>
  <script src="/src/views/reports.js"></script>
  <script src="/src/views/village.js"></script>
  <script src="/src/views/settings.js"></script>
  <script src="/src/views/home-practice.js"></script>
  <script src="/src/app.js"></script>
  <script>
    document.querySelectorAll('.bottom-nav button[data-route]').forEach(btn => {
      btn.addEventListener('click', () => window.PlannerApp.navigate(btn.dataset.route));
    });
    document.getElementById('settings-gear').addEventListener('click', () => window.PlannerApp.navigate('settings'));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
